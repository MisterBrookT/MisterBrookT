<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-labelledby="title desc">
  <title id="title">blackblue research map</title>
  <desc id="desc">Three overlapping rings connect HCI, visualization, and AI agents around public good.</desc>
  <style>
    .ring {
      fill: none;
      stroke: #1f2328;
      stroke-width: 1.5;
    }
    .label {
      fill: #1f2328;
      font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 1.2px;
    }
    .core {
      fill: #1f2328;
      font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 1.4px;
    }
    .dot {
      fill: #1f2328;
    }
    .core-back {
      fill: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #f0f6fc; }
      .label, .core, .dot { fill: #f0f6fc; }
      .core-back { fill: #0d1117; }
    }
  </style>

  <circle class="ring" cx="230" cy="88" r="72"/>
  <circle class="ring" cx="330" cy="88" r="72"/>
  <circle class="ring" cx="280" cy="142" r="72"/>

  <text class="label" x="199" y="68" text-anchor="middle">HCI</text>
  <text class="label" x="361" y="68" text-anchor="middle">AGENTS</text>
  <text class="label" x="280" y="181" text-anchor="middle">VIS</text>

  <circle class="dot" cx="280" cy="108" r="2.5"/>
  <rect class="core-back" x="220" y="112" width="120" height="20" rx="10"/>
  <text class="core" x="280" y="126" text-anchor="middle">PUBLIC GOOD</text>
</svg>
